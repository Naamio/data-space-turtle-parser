[package]
name = "turtle-parser"
description = "A linked-data:rdf parser component that reads Turtle and streams back the statements a document makes, as written"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[lib]
# A WebAssembly component is built as a dynamic library. The Rust library lets the
# grammar's tests run natively, without a component or a host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The Rust kit, from the `kits/rust` submodule. It owns the contract's bindings and the
# export, and holds the contract in its own submodule, so this crate holds only the grammar.
naamio-space-kit-rdf = { path = "kits/rust/rdf" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
excessive_nesting = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
missing_docs_in_private_items = "deny"
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
